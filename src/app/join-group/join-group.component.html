<div class="min-h-screen bg-gradient-to-br from-sky-400 via-indigo-500 to-purple-600 font-sans text-white p-4 flex flex-col justify-between">
  
  <!-- Header / Navigation -->
  <header class="max-w-4xl mx-auto w-full py-4 flex justify-between items-center">
    <a routerLink="/" class="flex items-center gap-2 cursor-pointer opacity-90 hover:opacity-100 transition-opacity">
      <img src="icon.png" alt="EntreNos Logo" class="h-8 w-8 rounded-xl shadow-md">
      <span class="font-bold text-lg tracking-tight">EntreNos</span>
    </a>
  </header>

  <!-- Main Content Card -->
  <main class="max-w-md mx-auto w-full my-auto">
    <div class="bg-white/10 backdrop-blur-md rounded-3xl p-8 md:p-10 border border-white/20 shadow-2xl text-center relative overflow-hidden animate-fade-in">
      <!-- Decorative background blur blobs -->
      <div class="absolute -top-10 -right-10 w-24 h-24 bg-sky-300 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-pulse"></div>
      <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-pulse"></div>

      <!-- Icon -->
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/20 mb-6 relative">
        <svg class="h-8 w-8 text-sky-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-2">¡Te invitaron a un grupo!</h1>
      <p class="text-white/80 text-sm md:text-base mb-8">
        Usa este código para unirte al presupuesto compartido en la aplicación y llevar las cuentas claras.
      </p>

      <!-- Invitation Code Display -->
      <div class="bg-black/20 rounded-2xl p-6 mb-8 border border-white/10 relative group">
        <span class="block text-xs uppercase tracking-widest text-white/50 mb-1">Código de Invitación</span>
        <span class="block text-4xl font-mono font-bold tracking-wider text-sky-200 select-all">{{ inviteCode }}</span>
        
        <button 
          (click)="copyCode()" 
          class="mt-4 inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-xs font-semibold px-4 py-2 rounded-full border border-white/10"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          {{ copied ? '¡Copiado!' : 'Copiar Código' }}
        </button>
      </div>

      <!-- Action Button -->
      <button 
        (click)="openApp()" 
        class="w-full bg-white text-indigo-900 hover:bg-sky-50 font-extrabold py-4 px-6 rounded-2xl shadow-lg transition-all duration-300 hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 mb-6"
      >
        <span>Abrir en la Aplicación</span>
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <!-- App Download Helper -->
      <div class="border-t border-white/10 pt-6">
        <p class="text-white/60 text-xs mb-4">¿Aún no tienes EntreNos? Descárgala gratis:</p>
        <div class="flex justify-center gap-3">
          <a href="#" class="bg-black/30 hover:bg-black/40 border border-white/10 px-4 py-2 rounded-xl text-xs font-bold transition-colors">
            Google Play
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-4xl mx-auto w-full text-center py-6 text-white/50 text-xs border-t border-white/10 mt-8">
    <p>© {{ currentYear }} EntreNos. Todos los derechos reservados.</p>
  </footer>
</div>
